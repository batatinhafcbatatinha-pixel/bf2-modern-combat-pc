name: Game data installer
on:
  workflow_dispatch:
  push:
    paths:
      - installer.json
      - tools/port-installer
      - .github/workflows/install-files.yml
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init -- tools/port-installer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyinstaller>=6,<7'
      - run: python -m PyInstaller --onefile --windowed --name Instalar-Arquivos tools/port-installer/installer.py
      - run: Copy-Item installer.json dist/installer.json
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-Arquivos-Windows
          path: dist/*
